; I'm Using This Now settings. Changes apply the next time you start the game.

[General]
; 1 = on, 0 = off.
bEnabled=1
; How long to wait for the NPC to get up before giving up (seconds).
fMaxWaitSeconds=10
; 1 = followers step away too, 0 = leave followers alone.
bIncludeFollowers=1

[Text]
; Shown instead of "Someone else is using this."
; {name} becomes the NPC's name.
sMessage=I'm using this now. Get lost, {name}.
; Shown when the NPC has no name.
sMessageNoName=I'm using this now.
